<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Живой листопад — добавить лист</title>
<link rel="stylesheet" href="/r/app.css">
</head>
<body>
<main id="app">
  <header>
    <div class="brand">🍁 Живой листопад</div>
    <div class="room" id="room">комната …</div>
  </header>

  <section id="s-shoot">
    <label class="big-btn" id="shoot-btn">
      <span class="icon">📷</span>
      <span>Сфотографировать лист</span>
      <input type="file" accept="image/*" capture="environment" hidden>
    </label>
    <p class="hint">Лист целиком, все четыре чёрных квадрата в кадре, ровно и при хорошем свете.</p>
    <div class="msg" id="msg" hidden></div>
  </section>

  <section id="s-send" hidden>
    <img id="preview" alt="Вырезанный лист">
    <div class="kind" id="kind"></div>
    <label class="field">Как зовут художника?
      <input id="name" maxlength="20" placeholder="Имя (необязательно)" autocomplete="off">
    </label>
    <div class="row">
      <button class="btn secondary" id="retake">Переснять</button>
      <button class="btn" id="send">Отправить на экран</button>
    </div>
  </section>

  <section id="s-mine">
    <h2>Мои листья</h2>
    <div class="mine" id="mine"><span class="hint">пока пусто</span></div>
  </section>

  <details id="s-owner">
    <summary>Я владелец комнаты</summary>
    <div id="owner-out" hidden>
      <p>Вы вошли как владелец.</p>
      <label class="field">Код с экрана телевизора (4 цифры)
        <input id="pair-code" inputmode="numeric" maxlength="4" placeholder="1234">
      </label>
      <label class="field">Как назвать экран
        <input id="pair-label" maxlength="40" placeholder="Телевизор в гостиной">
      </label>
      <button class="btn" id="pair-btn">Привязать телевизор</button>
      <div class="msg" id="owner-msg" hidden></div>
      <h3>Экраны</h3>
      <div id="screens" class="screens"></div>
    </div>
    <div id="owner-in">
      <label class="field">Пароль владельца
        <input id="password" maxlength="8" autocomplete="off" placeholder="6 символов">
      </label>
      <button class="btn" id="login-btn">Войти</button>
      <div class="msg" id="login-msg" hidden></div>
    </div>
  </details>

  <footer><a href="/api/sheets.pdf" target="_blank">Раскраски (PDF)</a> · <a href="/rules">Правила и данные</a></footer>
</main>
<script src="/vendor/capture.js"></script>
<script type="module" src="/r/app.js"></script>
</body>
</html>
