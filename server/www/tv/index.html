<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Живой листопад</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #dev {
    position: fixed; left: 12px; top: 12px; padding: 8px 10px; z-index: 10;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e4da;
    background: rgba(20, 22, 26, .62); border-radius: 6px; white-space: pre; pointer-events: none;
  }
  #dev[hidden] { display: none; }
  #capture { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #cap-btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 20px; border-radius: 999px; cursor: pointer;
    background: rgba(255, 244, 222, .92); color: #4a2e10; font-weight: 600; box-shadow: 0 4px 18px rgba(0,0,0,.35); user-select: none; }
  #cap-btn span { font-size: 22px; }
  #cap-btn:active { transform: scale(.97); }
  #cap-btn.busy { opacity: .6; pointer-events: none; }
  #cap-msg { max-width: min(420px, 80vw); padding: 10px 14px; border-radius: 10px; background: rgba(20, 22, 26, .85); color: #f2ead8; }
  #cap-msg[data-kind="ok"] { background: rgba(58, 96, 40, .9); }
  #cap-msg[data-kind="err"] { background: rgba(120, 40, 30, .9); }
  #cap-msg[hidden], #cap-preview[hidden] { display: none; }
  #cap-preview { width: 140px; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.35); background: #fff; }
  /* режим телевизора */
  #tv { position: fixed; inset: 0; z-index: 30; pointer-events: none; font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #3a2410; }
  .tv-card { pointer-events: auto; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 420px; padding: 36px 44px; border-radius: 24px;
    background: rgba(255, 246, 228, .96); box-shadow: 0 12px 48px rgba(0,0,0,.45); text-align: center; }
  .tv-title { font-size: 30px; font-weight: 700; margin-bottom: 14px; }
  .tv-hint { color: #7a5a3a; font-size: 17px; margin: 10px 0; }
  .tv-code { font: 700 72px/1.1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: #b8531e; margin: 8px 0 12px; }
  .tv-pass { font-size: 48px; color: #3a2410; }
  .tv-btn { pointer-events: auto; margin-top: 8px; padding: 14px 26px; border: 0; border-radius: 999px; background: #e5862a; color: #fff; font-size: 20px; font-weight: 600; cursor: pointer; }
  .tv-err { margin-top: 12px; color: #b0402a; }
  .tv-corner { position: absolute; left: 20px; bottom: 20px; display: flex; gap: 14px; align-items: center; padding: 12px 16px 12px 12px; border-radius: 16px;
    background: rgba(255, 246, 228, .92); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .tv-corner img { width: 120px; height: 120px; border-radius: 8px; }
  .tv-corner-title { font-size: 20px; font-weight: 700; }
  .tv-corner-hint { color: #7a5a3a; font-size: 15px; }
  .tv-corner-code { margin-top: 6px; font: 600 22px ui-monospace, Menlo, Consolas, monospace; color: #b8531e; letter-spacing: .06em; }
</style>
  <script type="module" crossorigin src="./assets/main-BQ6lNO7j.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/dev-CTfQzHK_.js">
</head>
<body>
<canvas id="view"></canvas>
<div id="dev"></div>

</body>
</html>
