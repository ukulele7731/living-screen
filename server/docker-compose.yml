# «Живой экран» — два контейнера: app (Node + SQLite + папка data/) и caddy (HTTPS, статика).
#   cp .env.example .env && docker compose up -d --build
#   curl http://localhost:8080/healthz
# На VPS то же самое: SITE_ADDRESS=домен в .env и порты Caddy 80/443.
name: living-screen

services:
  app:
    build: .
    restart: unless-stopped
    # PID 1 — настоящий init, а не node: зависший healthcheck внутри контейнера
    # иначе оставляет зомби-процесс до перезапуска
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      # База и детские рисунки. Обычная папка, а не docker-том: бэкап — архивом, переезд — копированием.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:80"          # локально; на VPS заменить на "80:80" и "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  caddydata:
  caddyconfig:
