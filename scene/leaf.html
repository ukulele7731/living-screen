<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лист крупным планом</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #dev { position: fixed; left: 12px; top: 12px; padding: 8px 10px; z-index: 10; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
         color: #e8e4da; background: rgba(20, 22, 26, .62); border-radius: 6px; white-space: pre; pointer-events: none; }
  #dev[hidden] { display: none; }
  #panel { position: fixed; right: 12px; top: 12px; width: 240px; padding: 10px 12px; z-index: 10; font: 13px/1.6 system-ui, sans-serif;
           color: #e8e4da; background: rgba(20, 22, 26, .72); border-radius: 8px; }
  #panel label { display: grid; grid-template-columns: 90px 1fr 42px; align-items: center; gap: 6px; }
  #panel input[type=range] { width: 100%; }
  #panel select { width: 100%; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="dev"></div>
<div id="panel">
  <label>вид <select id="kind"></select><span></span></label>
  <label>текстура <select id="tex"><option value="paint">нарисованная</option><option value="test">из теста (PNG)</option></select><span></span></label>
  <label>солнце <select id="sun"><option value="front">спереди</option><option value="side">сбоку</option><option value="back">сзади</option></select><span></span></label>
  <label>вариант <input id="variant" type="range" min="0" max="3" step="1" value="0"><span id="variant-v">0</span></label>
  <label>сухость <input id="dry" type="range" min="0" max="1" step="0.01" value="0.3"><span id="dry-v">0.30</span></label>
  <label>изгиб <input id="bend" type="range" min="-0.3" max="0.3" step="0.01" value="0"><span id="bend-v">0.00</span></label>
  <label>флаттер <input id="flutter" type="range" min="0" max="1" step="0.01" value="0.4"><span id="flutter-v">0.40</span></label>
  <label>кручение <input id="twist" type="range" min="-1" max="1" step="0.01" value="0"><span id="twist-v">0.00</span></label>
  <label>просвет <input id="trans" type="range" min="0" max="3" step="0.05" value="1.1"><span id="trans-v">1.10</span></label>
  <label>вращение <input id="spin" type="range" min="0" max="1" step="0.01" value="0.25"><span id="spin-v">0.25</span></label>
</div>
<script type="module" src="/src/leaf-test.ts"></script>
</body>
</html>
